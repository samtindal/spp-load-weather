version: 2
updates:
  # Let new releases bake for a week before proposing them: a compromised
  # release is usually caught and pulled within days.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /ingest
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: terraform
    directories: [/terraform, /terraform/bootstrap]
    schedule:
      interval: monthly
